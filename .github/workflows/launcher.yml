# Launcher CI -- build + test the launcher/ Rust crate on both targets.
#
# Two matrix arms:
#   windows-latest / x86_64-pc-windows-msvc  -- CRT-static build (via launcher/.cargo/config.toml)
#   ubuntu-latest  / x86_64-unknown-linux-musl -- fully static binary; verified with `file` + `ldd`
#
# `working-directory: launcher` means all cargo commands run from inside launcher/,
# so launcher/.cargo/config.toml (+crt-static target cfg) is auto-discovered on Windows
# and relative target/ paths in the static-verify step resolve under launcher/.
#
# All actions SHA-pinned to commit SHAs per sha_pinning_required enforcement.
# Comments are precise (# vX.Y.Z) to keep Dependabot's github-actions ecosystem
# tracking aligned (bare-major comments are a documented Dependabot blind spot).

name: launcher

on:
  # build-and-test is a REQUIRED status check on master. A required check must
  # report on every PR, or GitHub blocks the PR "waiting for status" — so the
  # pull_request trigger runs on ALL PRs (no paths filter). The push trigger
  # stays path-filtered for master-push efficiency.
  push:
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher.yml'
  pull_request:

permissions:
  contents: read

# Cancel a PR's superseded in-progress run on new pushes; never cancel
# master-push runs (build-and-test is a required check). #130.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup is preinstalled on GitHub-hosted runners; set the toolchain
      # directly rather than via a toolchain action, because the repo's Actions
      # allowlist permits only github-owned + ossf/scorecard-action + dependabot
      # (a non-owner toolchain action fails the workflow at startup).
      #
      # No time limit: each step that installs, builds, downloads or tests runs under
      # stall-watch.sh (stall-watch.ps1 on Windows), which stops it only when it stops
      # making progress (see the note at the top of ci.yml). Each such step comes
      # twice, one per runner OS; the paths start at ../ because of the
      # working-directory above.
      - name: Set up Rust (stable + target + components)
        if: runner.os != 'Windows'
        run: |
          bash ../.github/scripts/stall-watch.sh --name "rustup toolchain install" -- \
            rustup toolchain install stable --profile minimal --component clippy --component rustfmt --no-self-update
          rustup default stable
          bash ../.github/scripts/stall-watch.sh --name "rustup target add" -- rustup target add ${{ matrix.target }}
      - name: Set up Rust (stable + target + components)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh -NoProfile -File ../.github/scripts/stall-watch.ps1 "rustup toolchain install" rustup toolchain install stable --profile minimal --component clippy --component rustfmt --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File ../.github/scripts/stall-watch.ps1 "rustup target add" rustup target add ${{ matrix.target }}
      - name: Install musl linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          bash ../.github/scripts/stall-watch.sh --name "apt-get update" -- sudo apt-get update
          bash ../.github/scripts/stall-watch.sh --name "apt-get install" -- sudo apt-get install -y musl-tools
      # Cache the crates.io index + downloaded sources + compiled deps per
      # (os, target, Cargo.lock). github-owned actions/cache — the repo's
      # allowed_actions=selected list blocks Swatinem/rust-cache (non-owner). #131.
      - name: Cache cargo + target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            launcher/target/
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('launcher/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-
      - name: cargo fmt --check
        if: runner.os != 'Windows'
        run: bash ../.github/scripts/stall-watch.sh --name "cargo fmt" -- cargo fmt --check
      - name: cargo fmt --check
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File ../.github/scripts/stall-watch.ps1 "cargo fmt" cargo fmt --check
      - name: cargo clippy
        if: runner.os != 'Windows'
        run: bash ../.github/scripts/stall-watch.sh --name "cargo clippy" -- cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: cargo clippy
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File ../.github/scripts/stall-watch.ps1 "cargo clippy" cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: cargo test
        if: runner.os != 'Windows'
        run: bash ../.github/scripts/stall-watch.sh --name "cargo test" -- cargo test --target ${{ matrix.target }}
      - name: cargo test
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File ../.github/scripts/stall-watch.ps1 "cargo test" cargo test --target ${{ matrix.target }}
      - name: cargo build --release
        if: runner.os != 'Windows'
        run: bash ../.github/scripts/stall-watch.sh --name "cargo build" -- cargo build --release --target ${{ matrix.target }}
      - name: cargo build --release
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File ../.github/scripts/stall-watch.ps1 "cargo build" cargo build --release --target ${{ matrix.target }}
      - name: Verify Linux binary is static
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/svgedit
          file "$BIN"
          ldd "$BIN" || true   # ldd exits nonzero on a fully-static binary -- that is the goal
