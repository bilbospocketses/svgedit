# CI: build + unit on every push/PR, then e2e shards in parallel.
#
# Three jobs:
#   build-and-unit  -- American spelling, lint, typecheck, build, vitest, upload dist/editor artifact
#   e2e-chromium    -- download artifact, run e2e --project chromium (in Playwright container)
#   e2e-firefox     -- download artifact, run e2e --project firefox (in Playwright container)
#
# The master branch ruleset requires all three job contexts.
# All actions pinned to commit SHAs per sha_pinning_required enforcement.
#
# The e2e jobs run inside the official Playwright Docker image, which ships
# with browsers pre-installed. This sidesteps the `playwright install` flow
# which has been intermittently hanging on GitHub-hosted runners (download
# reaches 100% then freezes for 60 min).

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# Cancel a PR's superseded in-progress run when new commits are pushed; never
# cancel master-push runs (they feed the required contexts and are the source
# of truth). #130.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The American-spelling gate below diffs from the merge-base with the
          # base branch and refuses a shallow clone.
          fetch-depth: 0

      # American spelling. The cross-repo gate from bilbospocketses/american-spelling
      # scans the lines this branch adds and its commit messages, and fails on a
      # British spelling. It runs first because it is the cheapest gate here.
      #
      # Steps inside build-and-unit rather than a job of their own: master's ruleset
      # requires a check named exactly `build-and-unit`, so a separate job would
      # not be required and could rot unnoticed.
      #
      # Exceptions are not kept in this repo. A verbatim quote takes the inline
      # `spelling: allow` marker; an identifier used on many lines goes in the
      # gate's central allow.txt, and reaches this repo when the pin is bumped.
      # On a push to master the base is master itself, so there is nothing to scan.
      - name: Fetch the base branch
        run: git fetch --no-tags origin "+refs/heads/${BASE}:refs/remotes/origin/${BASE}"
        env:
          BASE: ${{ github.base_ref || github.event.repository.default_branch }}
      - name: Check out the American-spelling gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bilbospocketses/american-spelling
          ref: 21ed7e5524c511d9ee584778d42b72e6ddaeba86 # v1.0.2
          path: .american-spelling
          persist-credentials: false
      - name: Check American spelling
        # The runner's own Python 3; the gate is stdlib-only.
        run: >-
          python3 .american-spelling/check-american-spelling.py
          --repo .
          --base "origin/${BASE}"
          --repo-slug "${SLUG}"
        env:
          BASE: ${{ github.base_ref || github.event.repository.default_branch }}
          SLUG: ${{ github.repository }}
      - name: Remove the gate checkout
        # Keeps the gate's files out of the tree the later steps lint, build and test.
        run: rm -rf .american-spelling

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --build

      - name: Type check (tests)
        run: npm run typecheck:tests

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npx vitest run

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-editor
          path: dist/editor/
          retention-days: 1

  e2e-chromium:
    needs: build-and-unit
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.57.0-noble
    timeout-minutes: 60
    env:
      # Firefox refuses to launch when $HOME isn't owned by the current user
      # (Playwright-in-Docker quirk). Setting HOME=/root sidesteps it.
      # Chromium doesn't need this but we set it on both jobs for symmetry.
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-editor
          path: dist/editor/

      - name: Install matching Playwright browser
        # Install the browser matching the INSTALLED @playwright/test version so a
        # newer npm package than the pinned container image still finds its browser
        # (avoids "Executable doesn't exist at /ms-playwright/..."). @playwright/test
        # (npm) and the container tag (github-actions) are different Dependabot
        # ecosystems and can't bump atomically, so they drift. This is a cached no-op
        # when they match; browser-only otherwise (system deps come from the container).
        run: npx playwright install chromium
      - name: E2e tests (chromium)
        run: npx playwright test --project chromium

  e2e-firefox:
    needs: build-and-unit
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.57.0-noble
    timeout-minutes: 60
    env:
      # Firefox refuses to launch when $HOME isn't owned by the current user
      # (Playwright-in-Docker quirk). Setting HOME=/root sidesteps it.
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-editor
          path: dist/editor/

      - name: Install matching Playwright browser
        # Install the browser matching the INSTALLED @playwright/test version so a
        # newer npm package than the pinned container image still finds its browser
        # (avoids "Executable doesn't exist at /ms-playwright/..."). @playwright/test
        # (npm) and the container tag (github-actions) are different Dependabot
        # ecosystems and can't bump atomically, so they drift. This is a cached no-op
        # when they match; browser-only otherwise (system deps come from the container).
        run: npx playwright install firefox
      - name: E2e tests (firefox)
        run: npx playwright test --project firefox
